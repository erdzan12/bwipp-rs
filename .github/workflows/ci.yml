name: CI

# Full pre-merge gate — runs on every pull request and on demand. Free on this
# public repo. Each job is a thin wrapper around the SAME local script that
# scripts/ci-local.sh runs, so the logic lives in one place. The only stage not
# run here is the heavy cargo-fuzz pass — it runs weekly in fuzz.yml.
#
# (Pushes to main aren't gated here: the full local gate, scripts/ci-local.sh,
# is run before pushing, and merges land via PRs that this workflow already
# checked. Add `push: { branches: [main] }` below if you want post-merge runs.)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt/clippy/test/doc/wasm (ci-rust.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/wasm
      - run: ./scripts/ci-rust.sh

  msrv:
    name: MSRV build + test (ci-msrv.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV toolchain (from rust/Cargo.toml rust-version)
        run: |
          msrv=$(grep -m1 '^rust-version' rust/Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$msrv" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: ./scripts/ci-msrv.sh

  inventory:
    name: Inventory + doc consistency (ci-inventory.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: node-sidecar/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install node-sidecar deps (bwip-js oracle, lockfile-pinned)
        run: npm --prefix node-sidecar ci
      - run: ./scripts/ci-inventory.sh

  security:
    name: cargo audit + cargo deny (ci-security.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: ./scripts/ci-security.sh

  golden:
    name: Golden + wasm-pack tests (ci-golden.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: ./scripts/ci-golden.sh

  web:
    name: Web — wasm drift + typecheck/build + e2e (ci-web.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: ./scripts/ci-web.sh
