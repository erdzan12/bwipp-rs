name: CI (manual)

# Hosted CI is intentionally disabled during development to keep Actions
# spend at zero — local Mac CI (scripts/ci-local.sh) is the source of truth.
#
# To re-enable hosted runs later, uncomment the push / pull_request /
# schedule keys below. The jobs themselves are deliberately thin: they
# only call the local CI scripts so logic stays in one place.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC

# Concurrency: only one in-flight run per ref. Cancel earlier in-progress
# runs so manual reruns don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (calls scripts/ci-rust.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/wasm
      - name: Run local Rust CI
        run: ./scripts/ci-rust.sh

  golden:
    name: Golden tests (calls scripts/ci-golden.sh)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack
      - name: Run local golden CI
        run: ./scripts/ci-golden.sh

  web:
    name: Web (calls scripts/ci-web.sh)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/wasm
      - name: Run local Web CI
        run: ./scripts/ci-web.sh
