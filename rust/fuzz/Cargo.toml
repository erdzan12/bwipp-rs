[package]
name = "bwipp-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.bwipp-rs]
path = ".."

# --- Broad dispatch target: reaches every encoder via Symbology::all() ---
[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false

# --- Per-family targets: one per distinct complex encoder implementation
#     (the 17 mutation-tested large files + the 4 major 2D encoders not
#     among them: datamatrix, qrcode, pdf417, dotcode). Each concentrates
#     fuzz budget on a single encoder, vs. the broad target above which
#     splits its budget across all 154 symbology variants. ---

